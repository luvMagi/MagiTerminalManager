[project]
name = "magiterm"
version = "0.1.0.dev0"
description = "MagiTerminalManager - GUI generator for Windows Terminal workspaces and appearance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "luvmagi", email = "luvmagi@outlook.com" }]

# Zero third-party runtime dependencies. The GUI is tkinter (stdlib) and .lnk
# generation goes through PowerShell's WScript.Shell.CreateShortcut rather than
# pywin32. Do not add a runtime dependency without revisiting that decision.
dependencies = []

[project.scripts]
magiterm = "magiterm.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magiterm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["spike"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
exclude = ["^spike/"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
